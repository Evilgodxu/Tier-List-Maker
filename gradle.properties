# ============================================================
# Gradle Daemon 与构建性能优化
# ============================================================
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=2048m
org.gradle.parallel=true
org.gradle.caching=true
# 并行度上限：默认按逻辑核数放开后，R8 与 Lint 各自再按核数展线程，
# CPU 与内存带宽互相争抢反而更慢
org.gradle.workers.max=4
# 配置缓存：版本巡检插件已改为按需任务，不再在配置阶段遍历项目树
org.gradle.configuration-cache=true
# IDE 同步经 Tooling API 并行构建模型；不显式声明时会从 org.gradle.parallel 隐式推导，
# 该隐式推导已弃用，Gradle 10 起在模型构建期间直接报错
org.gradle.tooling.parallel=true

# ============================================================
# Kotlin 编译优化
# ============================================================
kotlin.code.style=official
kotlin.incremental=true
# 编码随 Gradle 侧一致固定为 UTF-8：编译守护进程独立于 daemon，不继承它的 file.encoding
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# ============================================================
# Android Gradle Plugin 优化
# ============================================================
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# 显式开启 R8 全模式，启用更激进的代码优化
android.enableR8.fullMode=true
